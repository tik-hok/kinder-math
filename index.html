<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>松果數學樂園</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="幼兒園大班數學遊戲：數數看、比多少、加加看、找規律、數字火車">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌰</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Huninn&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen forest app. Home = mascot + level switch + mode cards + sticker shelf; game = prompt, tap-to-count stage, big answer buttons. Single bright theme on purpose. */
:root{
  --sky:#E3F3E8; --sky2:#CFEAD8; --leaf:#3B8B57; --leaf-d:#2A6A40;
  --sun:#FFC93C; --sun-d:#E5A81A; --berry:#E4505B; --bark:#8A5A35;
  --card:#FFFDF8; --ink:#2C3A31; --soft:#5D6E63; --line:#C4DCCB;
  --f-cn:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-num:"Baloo 2","Huninn",system-ui,sans-serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-cn);font-size:18px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:auto 0 0;height:90px;background:radial-gradient(120% 100% at 50% 100%,var(--sky2) 60%,transparent 61%);z-index:-1}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sun-d);outline-offset:3px}
.app{max-width:920px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}

/* ---------- home ---------- */
.hero{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mascot{font-size:84px;line-height:1;background:none;border:0;padding:0;animation:bob 2.4s ease-in-out infinite}
.bubble{position:relative;background:var(--card);border-radius:22px;padding:12px 18px;font-size:20px;box-shadow:0 4px 0 var(--line);flex:1;min-width:200px}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:var(--card);border-left:0}
h1{font-size:clamp(30px,6vw,46px);margin:0 0 2px;color:var(--leaf-d);letter-spacing:2px;text-wrap:balance}
.bank{display:flex;gap:10px;margin-left:auto}
.chip{background:var(--card);border-radius:999px;padding:6px 14px;font:800 22px var(--f-num);box-shadow:0 3px 0 var(--line);display:flex;align-items:center;gap:4px}
.levels{display:flex;gap:10px;margin:18px 0 8px;flex-wrap:wrap}
.lv{border:3px solid transparent;background:var(--card);border-radius:18px;padding:10px 18px;font-size:19px;box-shadow:0 4px 0 var(--line)}
.lv small{display:block;color:var(--soft);font-size:14px}
.lv[aria-pressed="true"]{border-color:var(--leaf);background:#F1FFF5}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:10px}
.mode{border:0;background:var(--card);border-radius:24px;padding:16px 12px 14px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s}
.mode:hover{transform:translateY(-3px)}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.mode .ic{font-size:52px;line-height:1.1}
.mode b{font-size:24px;font-weight:400;color:var(--leaf-d)}
.mode span{font-size:15px;color:var(--soft)}
.mode i{font-style:normal;font:700 16px var(--f-num);color:var(--sun-d)}
h2{font-size:22px;font-weight:400;margin:26px 0 8px;color:var(--bark)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;background:#EAD9C2;border-radius:20px;padding:12px;box-shadow:inset 0 -6px 0 #D6BE9E}
.st{aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-size:36px;background:#F6EBDC;border-radius:16px}
.st.lock{font:800 24px var(--f-num);color:#C9AF8C}
.tip{color:var(--soft);font-size:15px;margin-top:10px}

/* ---------- game ---------- */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{border:0;background:var(--card);border-radius:16px;padding:10px 16px;font-size:18px;box-shadow:0 4px 0 var(--line)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.cones{display:flex;gap:4px;margin:0 auto}
.cone{font-size:28px;filter:grayscale(1) opacity(.35);transition:filter .3s,transform .3s}
.cone.on{filter:none;transform:scale(1.15)}
.ask{display:flex;align-items:center;gap:12px;margin:18px 0 10px;justify-content:center;flex-wrap:wrap}
.ask .face{font-size:54px;transition:transform .3s}
.ask .face.yay{animation:jump .6s}
.ask .face.hmm{animation:tilt .6s}
.qtext{font-size:clamp(24px,5vw,34px);background:var(--card);border-radius:20px;padding:10px 20px;box-shadow:0 4px 0 var(--line);text-wrap:balance;text-align:center}
.stage{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin:8px 0 18px}
.items{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:560px}
.it{font-size:46px;width:62px;height:62px;display:grid;place-items:center;position:relative;cursor:pointer;border-radius:16px;transition:transform .15s,background .2s}
.it:active{transform:scale(.9)}
.it.done{background:#FFF3C9}
.it.done::after{content:attr(data-n);position:absolute;top:-6px;right:-6px;background:var(--sun);border-radius:50%;width:28px;height:28px;font:800 17px/28px var(--f-num);text-align:center;color:var(--ink)}
.it.gone{opacity:.28;cursor:default}
.it.gone::before{content:"💨";position:absolute;font-size:26px;right:-4px;bottom:-4px;opacity:1}
.eq{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.eq .grp{background:var(--card);border-radius:20px;padding:8px;box-shadow:0 4px 0 var(--line)}
.eq .grp .items{max-width:280px}
.sym{font:800 52px var(--f-num);color:var(--berry)}
.qbox{width:72px;height:72px;border-radius:18px;border:4px dashed var(--sun-d);display:grid;place-items:center;font:800 42px var(--f-num);color:var(--sun-d);background:#FFFBEA}
.word{font-size:22px;color:var(--soft)}
.row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
.pt{font-size:46px;width:64px;height:64px;display:grid;place-items:center;background:var(--card);border-radius:16px;box-shadow:0 3px 0 var(--line)}
.train{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:6px}
.loco{font-size:56px;line-height:1}
.car{width:64px;height:58px;background:var(--berry);color:#fff;border-radius:12px 12px 6px 6px;font:800 34px/58px var(--f-num);text-align:center;position:relative}
.car::after{content:"";position:absolute;left:8px;right:8px;bottom:-10px;height:12px;background:radial-gradient(circle at 25% 50%,var(--ink) 5px,transparent 6px),radial-gradient(circle at 75% 50%,var(--ink) 5px,transparent 6px)}
.car.q{background:var(--sun);color:var(--ink)}
.car:nth-child(odd){background:#4C7FD8}
.car.q:nth-child(odd){background:var(--sun)}
.opts{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.opt{min-width:100px;height:100px;padding:0 10px;font:800 56px/1 var(--f-num);border-radius:26px;border:0;background:var(--card);box-shadow:0 7px 0 var(--line);transition:transform .12s,background .2s}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 var(--line)}
.opt.emo{font-size:52px}
.opt.big{width:min(43vw,320px);height:auto;min-height:170px;padding:12px 8px;font-size:inherit}
.opt.big .it{width:46px;height:46px;font-size:36px;cursor:inherit}
.opt.right{background:var(--leaf);color:#fff;box-shadow:0 7px 0 var(--leaf-d);animation:pop .4s}
.opt.big.right{background:#BFE8CB}
.opt.wrong{animation:shake .4s;opacity:.4}
.opt.hint{animation:pulse 1s infinite}

/* ---------- win overlay ---------- */
.win{position:fixed;inset:0;background:rgba(44,58,49,.55);display:grid;place-items:center;z-index:20;padding:16px}
.wcard{background:var(--card);border-radius:30px;padding:24px 22px;text-align:center;max-width:420px;width:100%;animation:pop .5s}
.wcard h3{font-size:36px;font-weight:400;margin:0;color:var(--leaf-d)}
.wstars{font-size:52px;letter-spacing:6px;margin:6px 0}
.wsticker{font-size:96px;line-height:1.1;animation:spin 1s}
.wcard p{margin:6px 0 16px;color:var(--soft)}
.wbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wbtns .btn{font-size:20px;padding:12px 20px}
.wbtns .go{background:var(--sun);box-shadow:0 4px 0 var(--sun-d)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}

@keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}
@keyframes jump{40%{transform:translateY(-22px) scale(1.15)}}
@keyframes tilt{30%{transform:rotate(-14deg)}70%{transform:rotate(10deg)}}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
@keyframes pulse{50%{transform:scale(1.1);box-shadow:0 0 0 8px rgba(255,201,60,.6)}}
@keyframes spin{0%{transform:scale(0) rotate(-200deg)}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:480px){.mascot{font-size:64px}.opt{min-width:84px;height:84px;font-size:46px}.it{width:52px;height:52px;font-size:38px}.pt{width:52px;height:52px;font-size:38px}.car{width:52px;font-size:28px}}
</style>
</head>
<body>
<style>
.langs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.langs .lv{padding:8px 16px;font-size:17px}
.vnote{background:#FFF3C9;border-radius:14px;padding:8px 14px;font-size:15px;margin-top:10px;color:var(--bark)}
</style>
<canvas id="fx"></canvas>
<div class="app">
  <!-- HOME -->
  <section id="home">
    <div class="hero">
      <button class="mascot" id="mascot" aria-label="Songsong">🐿️</button>
      <div class="bubble"><h1 data-t="title">松果數學樂園</h1><span data-t="greet"></span></div>
      <div class="bank"><div class="chip">⭐ <span id="starN">0</span></div><div class="chip">🌰 <span id="coneN">0</span></div></div>
    </div>
    <div class="langs" role="group" aria-label="語言 Language">
      <button class="lv" data-lang="zh" aria-pressed="true">🗣️ 中文（台灣）</button>
      <button class="lv" data-lang="en" aria-pressed="false">🗣️ English (US)</button>
    </div>
    <p class="vnote" id="vnote" hidden></p>
    <div class="levels" role="group" aria-label="難度 Level">
      <button class="lv" data-lv="easy" aria-pressed="true"></button>
      <button class="lv" data-lv="hard" aria-pressed="false"></button>
    </div>
    <div class="modes" id="modes"></div>
    <h2 data-t="shelf"></h2>
    <div class="shelf" id="shelf"></div>
    <p class="tip" data-t="tip"></p>
  </section>

  <!-- GAME -->
  <section id="game" hidden>
    <div class="top">
      <button class="btn" id="back" data-t="back"></button>
      <div class="cones" id="cones"></div>
      <button class="btn" id="again" data-t="again"></button>
    </div>
    <div class="ask"><span class="face" id="face">🐿️</span><div class="qtext" id="qtext"></div></div>
    <div class="stage" id="stage"></div>
    <div class="opts" id="opts"></div>
  </section>
</div>

<div class="win" id="win" hidden>
  <div class="wcard">
    <h3 id="wtitle"></h3>
    <div class="wstars" id="wstars">⭐⭐⭐</div>
    <div class="wsticker" id="wsticker">🐰</div>
    <p id="wmsg"></p>
    <div class="wbtns"><button class="btn go" id="replay" data-t="replay"></button><button class="btn" id="home2" data-t="back"></button></div>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};

/* e = picture, zh = 國語名稱, m = 台灣常用量詞, en / ens = American English singular / plural */
const ITEMS=[
  {e:"🍎",zh:"蘋果",m:"顆",en:"apple",ens:"apples"},{e:"🍓",zh:"草莓",m:"顆",en:"strawberry",ens:"strawberries"},
  {e:"🐟",zh:"小魚",m:"條",en:"fish",ens:"fish"},{e:"🚗",zh:"小汽車",m:"輛",en:"car",ens:"cars"},
  {e:"🎈",zh:"氣球",m:"顆",en:"balloon",ens:"balloons"},{e:"🐥",zh:"小雞",m:"隻",en:"chick",ens:"chicks"},
  {e:"🍪",zh:"餅乾",m:"片",en:"cookie",ens:"cookies"},{e:"⭐",zh:"星星",m:"顆",en:"star",ens:"stars"},
  {e:"🌰",zh:"松果",m:"顆",en:"pinecone",ens:"pinecones"},{e:"🦋",zh:"蝴蝶",m:"隻",en:"butterfly",ens:"butterflies"},
  {e:"🍩",zh:"甜甜圈",m:"個",en:"donut",ens:"donuts"},{e:"🐞",zh:"瓢蟲",m:"隻",en:"ladybug",ens:"ladybugs"},
  {e:"🍌",zh:"香蕉",m:"根",en:"banana",ens:"bananas"},{e:"🧸",zh:"小熊",m:"隻",en:"teddy bear",ens:"teddy bears"}];
const byE=e=>ITEMS.find(i=>i.e===e);
const LEAVE=[["🎈","飛走了","flew away"],["🐥","跑走了","ran away"],["🍪","被吃掉了","got eaten"],["🐟","游走了","swam away"],["🦋","飛走了","flew away"],["🍎","被吃掉了","got eaten"]];
const STICKERS=["🐰","🐻","🐼","🦊","🐯","🐨","🦁","🐸","🐧","🦄","🐳","🦖","🐙","🦉","🐢","🐬","🦒","🐝","🦩","🐲"];

const T={
 zh:{title:"松果數學樂園",greet:"嗨！我是松松，選一個遊戲，一起來玩數學吧！",greetV:"嗨！我是松松！選一個遊戲，一起來玩數學吧！",
   easy:"🌱 小松果<small>數到 10・加到 5</small>",hard:"🌳 大松果<small>數到 20・加減到 10</small>",easyV:"小松果，簡單模式！",hardV:"大松果，挑戰模式！",
   shelf:"🏆 我的貼紙收藏",tip:"每玩完一關（5 題）就能得到一張新貼紙！點一點東西可以一個一個數喔。",
   back:"🏠 回家",again:"🔊 再聽一次",replay:"🔁 再玩一次",left:"還剩",
   praise:["答對了！好棒！","哇！你好厲害！","太聰明了！","完全正確！","讚喔！你是數學小高手！","耶！答對了！"],
   retry:["差一點點，再試一次！","沒關係，再想想看喔！","加油！再數一次看看！"],
   hint:"松松給你一個提示，看看會跳的那一個！",
   win3:"超級厲害！",win2:"太棒了！",msg:(n,t)=>`得到新貼紙！已收集 ${n} / ${t} 張`,msgAll:"你已經收集全部貼紙了，真是數學大王！",
   winV:(w,s)=>`${w}你得到${s}顆星星，還有一張新貼紙！`,
   noVoice:"這台裝置找不到台灣國語的語音，聽起來可能是大陸口音。建議用 Microsoft Edge 或 Google Chrome 開啟。",
   modes:{count:["數數看","有幾個呢？"],compare:["比多少","哪邊比較多？"],add:["加加看","合起來有幾個？"],pattern:["找規律","下一個是誰？"],seq:["數字火車","少了哪一號？"]}},
 en:{title:"Pinecone Math Park",greet:"Hi! I'm Songsong. Pick a game and let's play with numbers!",greetV:"Hi! I'm Songsong! Pick a game, and let's play with numbers!",
   easy:"🌱 Little Pinecone<small>Count to 10 · add to 5</small>",hard:"🌳 Big Pinecone<small>Count to 20 · add &amp; take away to 10</small>",easyV:"Little Pinecone. Easy mode!",hardV:"Big Pinecone. Challenge mode!",
   shelf:"🏆 My Sticker Collection",tip:"Finish a round (5 questions) to win a new sticker! Tap the pictures to count them one by one.",
   back:"🏠 Home",again:"🔊 Listen again",replay:"🔁 Play again",left:"left",
   praise:["Great job!","You got it!","Super smart!","That's right!","Wow! You're a math star!","Yay! Correct!"],
   retry:["So close! Try again!","That's okay. Think again!","You can do it! Count once more!"],
   hint:"Here's a hint from Songsong. Look at the bouncing one!",
   win3:"Amazing!",win2:"Great job!",msg:(n,t)=>`New sticker! You have ${n} of ${t}.`,msgAll:"You collected every sticker. You're a math champion!",
   winV:(w,s)=>`${w} You earned ${s} stars and a new sticker!`,
   noVoice:"這台裝置找不到美式英文的語音。建議用 Microsoft Edge 或 Google Chrome 開啟。",
   modes:{count:["Count It","How many?"],compare:["More or Fewer","Which has more?"],add:["Add It Up","How many in all?"],pattern:["Patterns","What comes next?"],seq:["Number Train","Which number is missing?"]}}
};
const MODES={count:"🔢",compare:"⚖️",add:"➕",pattern:"🧩",seq:"🚂"};

/* ---------- saved progress (per browser) ---------- */
let save={level:"easy",lang:"zh",stars:0,rounds:0,mode:{}};
try{const s=JSON.parse(localStorage.getItem("pinecone-math")||"null");if(s)save=Object.assign(save,s)}catch(e){}
const store=()=>{try{localStorage.setItem("pinecone-math",JSON.stringify(save))}catch(e){}};
const L=()=>save.level==="easy"?{count:10,cmp:7,add:5,seq:10,sub:false}:{count:20,cmp:12,add:10,seq:20,sub:true};
const t=()=>T[save.lang];
const EN=()=>save.lang==="en";

/* ---------- voices: Taiwan Mandarin (zh-TW) and American English (en-US) only ---------- */
const V={zh:null,en:null};let voicesLoaded=false;
function best(vs,langRe,prefs){const c=vs.filter(v=>langRe.test(v.lang));for(const p of prefs){const f=c.find(v=>p.test(v.name));if(f)return f}return c[0]||null}
function pickVoices(){try{const vs=speechSynthesis.getVoices();if(!vs.length)return;voicesLoaded=true;
  V.zh=best(vs,/^zh[-_]TW/i,[/HsiaoChen.*(Online|Natural)/i,/HsiaoYu.*(Online|Natural)/i,/(Online|Natural)/i,/Google/i,/Meijia|美佳/i,/Hanhan|Yating|Zhiwei/i]);
  V.en=best(vs,/^en[-_]US/i,[/(Ana|Jenny|Aria).*(Online|Natural)/i,/(Online|Natural)/i,/Google US/i,/Samantha/i,/Zira/i]);
  voiceNote()}catch(e){}}
function voiceNote(){const n=$("#vnote");n.hidden=!(voicesLoaded&&!V[save.lang]);n.textContent=t().noVoice}
try{pickVoices();speechSynthesis.onvoiceschanged=pickVoices}catch(e){}
function say(txt){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);
  if(EN()){u.lang="en-US";u.rate=.88;u.pitch=1.1}else{u.lang="zh-TW";u.rate=.9;u.pitch=1.2}
  if(V[save.lang])u.voice=V[save.lang];speechSynthesis.speak(u)}catch(e){}}

let ac=null;
function tone(freqs,dur=.12,type="sine",vol=.18){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();let tt=ac.currentTime;freqs.forEach(f=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,tt);g.gain.exponentialRampToValueAtTime(.001,tt+dur);o.connect(g).connect(ac.destination);o.start(tt);o.stop(tt+dur);tt+=dur*.8})}catch(e){}}
const ding=()=>tone([660,880,1320],.14,"triangle");
const boop=()=>tone([300,220],.16,"sine",.12);
const popS=n=>tone([500+n*40],.08,"triangle",.14);
const fanfare=()=>tone([523,659,784,1047,784,1047],.16,"triangle",.2);

/* ---------- home ---------- */
function applyLang(){document.documentElement.lang=EN()?"en-US":"zh-Hant-TW";
  document.querySelectorAll("[data-t]").forEach(n=>n.innerHTML=t()[n.dataset.t]);
  document.querySelectorAll(".lv[data-lv]").forEach(b=>b.innerHTML=t()[b.dataset.lv]);
  document.querySelectorAll(".lv[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===save.lang));
  voiceNote()}
function renderHome(){applyLang();
  $("#starN").textContent=save.stars;$("#coneN").textContent=save.rounds;
  document.querySelectorAll(".lv[data-lv]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lv===save.level));
  const m=$("#modes");m.innerHTML="";
  for(const k in MODES){const [nm,d]=t().modes[k];const b=el("button","mode",`<div class="ic">${MODES[k]}</div><b>${nm}</b><span>${d}</span><i>⭐ ${save.mode[k]||0}</i>`);b.onclick=()=>start(k);m.append(b)}
  const sh=$("#shelf");sh.innerHTML="";
  STICKERS.forEach((s,i)=>sh.append(i<save.rounds?el("div","st",s):el("div","st lock","?")));
}
document.querySelectorAll(".lv[data-lv]").forEach(b=>b.onclick=()=>{save.level=b.dataset.lv;store();renderHome();say(save.level==="easy"?t().easyV:t().hardV)});
document.querySelectorAll(".lv[data-lang]").forEach(b=>b.onclick=()=>{save.lang=b.dataset.lang;store();renderHome();say(t().greetV)});
$("#mascot").onclick=()=>{say(t().greetV);$("#mascot").animate([{transform:"scale(1)"},{transform:"scale(1.25) rotate(10deg)"},{transform:"scale(1)"}],{duration:500})};

/* ---------- question makers ---------- */
function numOpts(ans,lo,hi){const s=new Set([ans]);let guard=0;while(s.size<3&&guard++<50){const d=ans+pick([-2,-1,1,2,3,-3]);if(d>=lo&&d<=hi)s.add(d)}return [...s].sort((a,b)=>a-b).map(v=>({html:v,ok:v===ans}))}
function itemsBox(emo,n,gone=0){const box=el("div","items");for(let i=0;i<n;i++){const it=el("div","it",emo);if(i>=n-gone)it.classList.add("gone");else it.onclick=()=>tapCount(it);box.append(it)}return box}
function tapCount(it){if(it.classList.contains("done")||game.lock)return;game.tap++;it.dataset.n=game.tap;it.classList.add("done");popS(game.tap);say(String(game.tap))}
const noun=(it,n)=>n===1?it.en:it.ens;
const hl=w=>`<b style="color:var(--berry);font-weight:400">${w}</b>`;

const GEN={
  count(){const n=rand(1,L().count),it=pick(ITEMS);
    return{text:EN()?`How many ${it.e}?`:`有幾${it.m} ${it.e}？`,
      voice:EN()?`Let's count! How many ${it.ens} are there? Tap them to count one by one!`:`數數看，有幾${it.m}${it.zh}？可以點一點，一個一個數喔！`,
      build:st=>st.append(itemsBox(it.e,n)),opts:numOpts(n,1,L().count)}},
  compare(){const max=L().cmp;let a=rand(1,max),b=rand(1,max);while(a===b)b=rand(1,max);
    const it=pick(ITEMS),more=save.level==="easy"||Math.random()<.6;
    const ansLeft=more?a>b:a<b;
    const mk=n=>{const d=el("div","items");for(let i=0;i<n;i++)d.append(el("div","it",it.e));return d.outerHTML};
    const w=EN()?(more?"more":"fewer"):(more?"比較多":"比較少");
    return{text:EN()?`Which side has ${hl(w)} ${it.e}?`:`哪一邊的 ${it.e} ${hl(w)}？`,
      voice:EN()?`Which side has ${w} ${it.ens}? Tap that side!`:`哪一邊的${it.zh}${w}？點那一邊！`,
      build:()=>{},big:true,opts:[{html:mk(a),ok:ansLeft},{html:mk(b),ok:!ansLeft}]}},
  add(){const lv=L();
    if(lv.sub&&Math.random()<.4){const [e,zv,ev]=pick(LEAVE),it=byE(e);const a=rand(3,lv.add),b=rand(1,a-1);
      return{text:EN()?`${a} ${e}, ${b} ${ev}. How many are left?`:`${a} ${it.m} ${e}，${b} ${it.m}${zv}，還剩幾${it.m}？`,
        voice:EN()?`There are ${a} ${it.ens}. ${b} ${ev}. How many ${it.ens} are left?`:`${a}${it.m}${it.zh}，${b}${it.m}${zv}，還剩下幾${it.m}${it.zh}？`,
        build:st=>{const r=el("div","eq");r.append(itemsBox(e,a,b),el("span","word",t().left),el("div","qbox","?"));st.append(r)},opts:numOpts(a-b,0,lv.add)}}
    const s=rand(2,lv.add),a=rand(1,s-1),b=s-a,it=pick(ITEMS);
    return{text:EN()?`${a} ${it.e} and ${b} more. How many in all?`:`${a} ${it.m} ${it.e} 再來 ${b} ${it.m}，一共幾${it.m}？`,
      voice:EN()?`${a} ${noun(it,a)}, and ${b} more. How many ${it.ens} in all?`:`${a}${it.m}${it.zh}，再來${b}${it.m}${it.zh}，一共有幾${it.m}？`,
      build:st=>{const r=el("div","eq"),g1=el("div","grp"),g2=el("div","grp");g1.append(itemsBox(it.e,a));g2.append(itemsBox(it.e,b));
        r.append(g1,el("span","sym","+"),g2,el("span","sym","="),el("div","qbox","?"));st.append(r)},opts:numOpts(s,1,lv.add)}},
  pattern(){const kinds=save.level==="easy"?["AB","AAB","ABB"]:["ABC","AABB","ABB","AAB","ABAC"];
    const k=pick(kinds),pool=shuffle(ITEMS).slice(0,4).map(i=>i.e),map={A:pool[0],B:pool[1],C:pool[2]};
    const len=k.length>=4?k.length*2:k.length*2+(k.length===2?2:1);
    const seq=[];for(let i=0;i<=len;i++)seq.push(map[k[i%k.length]]);
    const ans=seq.pop();const choices=shuffle([...new Set([map.A,map.B,map.C||pool[3],pool[3]])]).slice(0,3);
    if(!choices.includes(ans))choices[0]=ans;
    return{text:EN()?"What comes next?":"下一個是誰？",voice:EN()?"Look at the pattern. What comes next?":"找找看規律，排排隊，下一個是誰呢？",
      build:st=>{const r=el("div","row");seq.forEach(s=>r.append(el("div","pt",s)));r.append(el("div","qbox","?"));st.append(r)},
      emo:true,opts:shuffle(choices).map(c=>({html:c,ok:c===ans}))}},
  seq(){const max=L().seq,len=5,startN=rand(1,max-len+1),hole=rand(1,len-1);const nums=[];for(let i=0;i<len;i++)nums.push(startN+i);
    const ans=nums[hole];
    return{text:EN()?"Which number is missing?":"火車少了哪一號？",voice:EN()?"The number train lost a car. Which number is missing?":"數字火車少了一節車廂，是幾號呢？",
      build:st=>{const tr=el("div","train");tr.append(el("span","loco","🚂"));nums.forEach((n,i)=>tr.append(el("div","car"+(i===hole?" q":""),i===hole?"?":n)));st.append(tr)},
      opts:numOpts(ans,1,max)}}
};

/* ---------- game flow ---------- */
const TOTAL=5;let game={};
let gameId=0;
function start(mode){game={mode,i:0,first:0,lock:false,id:++gameId};$("#home").hidden=true;$("#win").hidden=true;$("#game").hidden=false;scrollTo(0,0);next()}
function next(){if(game.i>=TOTAL)return finish();
  const q=GEN[game.mode]();game.q=q;game.tries=0;game.tap=0;game.lock=false;
  $("#cones").innerHTML="";for(let i=0;i<TOTAL;i++)$("#cones").append(el("span","cone"+(i<game.i?" on":""),"🌰"));
  $("#qtext").innerHTML=q.text;const st=$("#stage");st.innerHTML="";q.build(st);st.hidden=!!q.big;
  const o=$("#opts");o.innerHTML="";
  q.opts.forEach(op=>{const b=el("button","opt"+(q.big?" big":"")+(q.emo?" emo":""),String(op.html));b.onclick=()=>check(b,op.ok);o.append(b)});
  say(q.voice)}
function face(c){const f=$("#face");f.classList.remove("yay","hmm");void f.offsetWidth;f.classList.add(c)}
function check(b,ok){if(game.lock||b.disabled)return;
  if(ok){game.lock=true;b.classList.add("right");ding();face("yay");if(game.tries===0)game.first++;
    say(pick(t().praise));burst(b,24);$("#cones").children[game.i].classList.add("on");
    const id=game.id;setTimeout(()=>{if(id!==game.id||$("#game").hidden)return;game.i++;next()},1500)}
  else{game.tries++;b.classList.add("wrong");b.disabled=true;boop();face("hmm");
    if(game.tries>=2){const r=[...$("#opts").children].find((x,i)=>game.q.opts[i].ok);r&&r.classList.add("hint");say(t().hint)}
    else say(pick(t().retry))}}
function finish(){const stars=game.first>=4?3:2;save.stars+=stars;save.mode[game.mode]=(save.mode[game.mode]||0)+stars;
  const sticker=STICKERS[save.rounds%STICKERS.length];save.rounds++;store();
  const w=stars===3?t().win3:t().win2;
  $("#wtitle").textContent=w;$("#wstars").textContent="⭐".repeat(stars);
  $("#wsticker").textContent=sticker;$("#wmsg").textContent=save.rounds<=STICKERS.length?t().msg(save.rounds,STICKERS.length):t().msgAll;
  $("#win").hidden=false;fanfare();confetti();say(t().winV(w,stars))}
function goHome(){try{speechSynthesis.cancel()}catch(e){};gameId++;game.id=-1;$("#game").hidden=true;$("#win").hidden=true;$("#home").hidden=false;renderHome()}
$("#back").onclick=goHome;$("#home2").onclick=goHome;$("#replay").onclick=()=>start(game.mode);$("#again").onclick=()=>game.q&&say(game.q.voice);

/* ---------- confetti ---------- */
const cv=$("#fx"),cx=cv.getContext("2d");let parts=[],raf=0;
const COLORS=["#FFC93C","#E4505B","#3B8B57","#4C7FD8","#FF8FB1","#8A5A35"];
function fit(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}
addEventListener("resize",fit);fit();
function spawn(x,y,n,spread){if(parts.length>300)parts.splice(0,parts.length-300+n);for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*spread,vy:-Math.random()*spread*.9-2,r:4+Math.random()*5,c:pick(COLORS),a:Math.random()*6,life:90+Math.random()*50})}
function loop(){cx.clearRect(0,0,cv.width,cv.height);const d=devicePixelRatio;
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.25;p.a+=.2;p.life--;cx.save();cx.translate(p.x*d,p.y*d);cx.rotate(p.a);cx.fillStyle=p.c;cx.fillRect(-p.r*d/2,-p.r*d/4,p.r*d,p.r*d/2);cx.restore()});
  parts=parts.filter(p=>p.life>0&&p.y<innerHeight+40);raf=parts.length?requestAnimationFrame(loop):0}
function run(){if(matchMedia("(prefers-reduced-motion: reduce)").matches){parts=[];return}if(!raf)raf=requestAnimationFrame(loop)}
function burst(b,n){const r=b.getBoundingClientRect();spawn(r.left+r.width/2,r.top+r.height/2,n,10);run()}
function confetti(){for(let k=0;k<5;k++)spawn(innerWidth*(k+.5)/5,innerHeight*.35,30,14);run()}

renderHome();
</script>
